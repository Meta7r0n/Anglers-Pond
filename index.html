const CHARS = Object.keys(GLYPH).join('');
let ATLAS=null; const TINT={};
function buildFont(){
  const c=document.createElement('canvas');
  c.width=CHARS.length*ADV; c.height=FH;
  const q=c.getContext('2d'); q.fillStyle='#fff';
  for(let i=0;i<CHARS.length;i++){
    const rows=GLYPH[CHARS[i]];
    for(let r=0;r<FH;r++) for(let p=0;p<FW;p++)
      if (rows[r][p]==='#') q.fillRect(i*ADV+p, r, 1, 1);
  }
  ATLAS=c;
}
function tintFont(col){
  if (TINT[col]) return TINT[col];
  const c=document.createElement('canvas'); c.width=ATLAS.width; c.height=FH;
  const q=c.getContext('2d'); q.imageSmoothingEnabled=false;
  q.drawImage(ATLAS,0,0);
  q.globalCompositeOperation='source-in';
  q.fillStyle=col; q.fillRect(0,0,c.width,FH);
  TINT[col]=c; return c;
}
function textW(s){ return String(s).length*ADV-1; }
function drawStr(s,x,y,col){
  const a=tintFont(col);
  for(let i=0;i<s.length;i++){
    const ch=s[i]; if (ch===' ') continue;
    const k=CHARS.indexOf(ch); if (k<0) continue;
    g.drawImage(a, k*ADV, 0, FW, FH, x+i*ADV, y, FW, FH);
  }
}
function txt(s,x,y,col,align,shadow){
  s=String(s).toUpperCase();
  const w=textW(s);
  const px = align==='center' ? R(x-w/2) : align==='right' ? R(x-w) : R(x);
  const py = R(y);
  if (shadow!==false) drawStr(s,px+1,py+1,'#000');
  drawStr(s,px,py,col||'#fff');
}

];
function progressText(i){
  const s=S;
  if (i===0) return '';
  if (i===1) return s.cleared[0] ? '' : 'CLEAR WATER 1';
  if (i===2) return !s.cleared[1] ? 'CLEAR WATER 2' : (s.rupeesLifetime+'/1200R');
  if (i===3) return !s.cleared[2] ? 'CLEAR WATER 3' : (s.fishCaught+'/40 FISH');
  if (i===4) return !s.cleared[3] ? 'CLEAR WATER 4' : (s.rupeesLifetime+'/4000R');

  if (i===7) return s.cleared.slice(0,7).filter(Boolean).length+'/7 CLEARED';
  return '';
}

const Store = (() => {
  const KEY = s => 'anglers_pond_v4_slot' + s;
  let ok=false; const mem={};
  try { localStorage.setItem('__ap__','1'); localStorage.removeItem('__ap__'); ok=true; } catch(e){ ok=false; }
  return {
    get persistent(){ return ok; },
    read(s){ if(!ok) return mem[s]||null; try{ return JSON.parse(localStorage.getItem(KEY(s))); }catch(e){ return null; } },
    write(s,o){ if(!ok){ mem[s]=JSON.parse(JSON.stringify(o)); return false; }
                try{ localStorage.setItem(KEY(s), JSON.stringify(o)); return true; }catch(e){ return false; } },
    erase(s){ delete mem[s]; if(!ok) return; try{ localStorage.removeItem(KEY(s)); }catch(e){} }
  };
})();

    fishCaught:0, junkCaught:0, snaps:0, slips:0, cleanCatches:0,

    species:{}, lures:[0], lure:0, outfit:0, epic:false, track:'still',
    level:0, music:2, crt:true,
    open:[true,false,false,false,false,false,false,false],
    cleared:[false,false,false,false,false,false,false,false],
    lvFish:[0,0,0,0,0,0,0,0], lvStar:[false,false,false,false,false,false,false,false] };
}
function normalise(s){
  const b=blankSave();
  for (const k in b) if (s[k]===undefined) s[k]=b[k];
  ['open','cleared','lvFish','lvStar'].forEach(k=>{
    if (!Array.isArray(s[k]) || s[k].length!==8) s[k]=b[k];
  });
  if (!s.species) s.species={};
  if (!Array.isArray(s.lures) || !s.lures.length) s.lures=[0];
  s.open[0]=true;
  return s;
}

}

const Music = (() => {

      const br=s.bass.rate, bp=s.bass.pat;
      for(let k=0;k*br<bar;k++) ev.push({t:t0+k*br,ch:'bass',n:c.root+bp[k%bp.length],d:br*.95});
      const hr=s.harp.rate, hp=s.harp.pat;

      const bp=ac.createBiquadFilter(); bp.type=e.n?'highpass':'lowpass'; bp.frequency.value=e.n?2600:190;

    get track(){return cur;},
    setVol(v){ vol=clamp(v|0,0,3); if(A.mus) A.mus.gain.value=VOLS[vol]; S.music=vol; },
    get vol(){return vol;},

function startNibble(f){
  f.mood='nibble'; nibbleFish=f; nibbleT=1; lure.jig=3; S.bites++;
  Sfx.nibble(); shake=1.6; splash(lure.x,lure.y,3);
  setHint('IT HAS THE LURE \u2014 PRESS TO SET',400);
}
function updateFish(){
  const live = MODE==='GAME' && state==='WATER' && lure.wet;
  let best=null, bestScore=-1;
  for (const f of fishes){
    f.cyc += .06+(f.mood==='chase'?.06:0)+f.tailBoost;
    f.tailBoost*=.9;
    if (f.spook>0) f.spook--;
    if (f.mood==='hooked'||f.mood==='nibble') continue;
    if (!DEV.ai) continue;
    if (f.mood==='flee'){
      f.dir=1; f.x+=f.spd*1.9; f.interest=0;
      if (--f.moodT<=0 || f.x>W+20){
        if (f.x>W+30) Object.assign(f,makeFish(null,true));
        f.mood='wander'; f.moodT=ri(60,160);
      }
      continue;
    }
    if (live){
      const d=Math.hypot(f.x-lure.x,f.y-lure.y);
      if (d<80) f.interest += lureAppeal()*f.cur*DEV.curMul*depthMatch(f)*(1-d/80)*.9;
    }
    f.interest = clamp(f.interest-f.pat,0,150);
    if (!live) f.interest*=.92;
    if (f.mood==='wander'){
      if (--f.moodT<=0){ f.moodT=ri(50,150); f.vx=rnd(-1,1)*f.spd; f.vy=rnd(-.4,.4)*f.spd; }
      f.x+=f.vx; f.y+=f.vy;
      if (f.vx!==0) f.dir=f.vx>0?1:-1;
      const top=WATER_Y+10+f.band[0]*(DEPTH-20), bot=WATER_Y+10+f.band[1]*(DEPTH-20);
      if (f.y<top){ f.y=top; f.vy=Math.abs(f.vy); }
      if (f.y>bot){ f.y=bot; f.vy=-Math.abs(f.vy); }
      if (f.x<SHORE_X+26){ f.x=SHORE_X+26; f.vx=Math.abs(f.vx); }
      if (f.x>W-12){ f.x=W-12; f.vx=-Math.abs(f.vx); }
      if (f.interest>38 && live && !f.spook){ f.mood='curious'; f.tailBoost=.12; }
    } else {
      if (!live){ f.mood='wander'; f.moodT=40; continue; }
      const dx=lure.x-f.x, dy=lure.y-f.y, d=Math.hypot(dx,dy)||1;
      const sp=(f.mood==='chase'?1.5:.7)*f.spd;
      f.x+=(dx/d)*sp; f.y+=(dy/d)*sp+Math.sin(f.cyc)*.12;
      f.dir=dx>0?1:-1;
      f.mood = f.interest>76?'chase':'curious';
      if (f.interest<22){ f.mood='wander'; f.moodT=60; }
      if (f.wt>=7) for (const o of fishes){
        if (o!==f && o.wt*2.5<=f.wt && o.mood!=='hooked' && Math.hypot(o.x-f.x,o.y-f.y)<38){
          o.mood='flee'; o.moodT=90; o.interest=0; o.spook=140;
        }
      }
      if (d<8 && nibbleT<=0 && !hooked && f.interest>bestScore){ best=f; bestScore=f.interest; }
    }
  }
  if (best) startNibble(best);
  if (nibbleT>0 && nibbleFish){
    nibbleT++;
    const f=nibbleFish;
    f.x+=(lure.x-f.x)*.3; f.y+=(lure.y-f.y)*.3;
    lure.jig = 2.2+Math.sin(T*.9)*1.4;
    lure.pull = Math.min(6, nibbleT*.05);
    if (nibbleT%42===0) Sfx.nibble();
  } else lure.pull*=.9;
}
function setHook(){
  if (!nibbleFish) return;
  const h=nibbleFish; hooked=h; h.mood='hooked';
  let startT, stamMul;
  if (nibbleT<=26){ setQuality='CLEAN SET'; startT=16; stamMul=.82; S.cleanSets++; Sfx.clean(); }
  else if (nibbleT<=70){ setQuality='GOOD SET'; startT=26; stamMul=1; Sfx.hookset(); }
  else { setQuality='DEEP SET'; startT=36; stamMul=1.12; Sfx.hookset(); }
  nibbleFish=null; nibbleT=0; lure.pull=0;
  fight.tension=startT; fight.slackT=0;
  fight.mode='run'; fight.modeT=ri(36,64);
  fight.stam=h.t.stam*stamMul; fight.maxStam=fight.stam;
  fight.startX=h.x; fightFrames=0; peakTension=startT;
  state='FIGHT'; fisher.pose='fight'; S.hooksets++;
  shake=5; flash=4; splash(lure.x,lure.y,8);
  say(setQuality,90);
  setHint('HOLD TO REEL \u2022 LET GO WHEN IT RUNS',150);
}
function hookJunk(){
  hooked={isJunk:true,name:junk.name,val:junk.val,sub:junk.sub,w:junk.w,h:junk.h,x:junk.x,y:junk.y,t:junk.t};
  junk=null;
  fight.tension=10; fight.slackT=0; fight.mode='dead';
  fightFrames=0; peakTension=10;
  state='FIGHT'; fisher.pose='fight';
  Sfx.hookset(); shake=3;
  setHint('DEAD WEIGHT \u2014 PUMP, DO NOT HOLD',160);
}
function updateFight(reeling){
  const h=hooked; fightFrames++;
  if (h.isJunk){
    if (reeling){ fight.tension+=.45; h.x-=.9; h.y-=.34; if(T%7===0) Sfx.reel(); }
    else { fight.tension-=2.4; h.y=Math.min(BOT-h.h,h.y+.5); }
    h.y=clamp(h.y,WATER_Y+6,BOT-h.h);
  } else {
    if (--fight.modeT<=0){
      const spent=fight.stam<=0;
      if (fight.mode==='run'){ fight.mode='rest'; fight.modeT=ri(50,90); }
      else if (spent){ fight.mode='rest'; fight.modeT=60; }
      else { fight.mode='run'; fight.modeT=ri(34,30+44*(fight.stam/fight.maxStam)); h.tailBoost=.2; Sfx.strain(); }
    }
    const running = fight.mode==='run'&&fight.stam>0, reelSpd=1.5/(1+h.wt*.05);
    if (running){
      fight.stam-=2.2*DEV.fightMul; h.dir=1;
      if (reeling){ fight.tension+=.85+h.str*.5; h.x+=h.str*.18; shake=Math.max(shake,fight.tension*.05); }
      else { fight.tension-=2.2; h.x+=h.str*.45; }
      h.y+=Math.sin(T*.35)*1.1;
    } else {
      h.dir=-1;
      if (reeling){ fight.tension+=.25; h.x-=reelSpd; if(T%6===0) Sfx.reel(); }
      else { fight.tension-=2.5; h.x+=.06; }
      h.y+=Math.sin(T*.09)*.35;
    }
    h.x=clamp(h.x,10,Math.min(W-14,fight.startX+28));
    h.y=clamp(h.y,WATER_Y+9,BOT-8);
  }
  fight.tension=clamp(fight.tension,0,100);
  if (fight.tension>peakTension) peakTension=fight.tension;
  lure.x = h.isJunk ? h.x+h.w/2 : h.x+(h.dir>0?-9*h.len:9*h.len);
  lure.y = h.isJunk ? h.y : h.y-1;
  if (fight.tension>82 && T%9===0) Sfx.strain();
  if (fight.tension<4){
    if (++fight.slackT>150){
      if(!h.isJunk){ h.mood='flee'; h.moodT=150; h.interest=0; }
      hooked=null; S.slips++; Sfx.slip();
      resultCard('LINE WENT SLACK','THE HOOK SLIPPED FREE.',null,0); return;
    }
  } else fight.slackT=0;
  if (fight.tension>=100 && !DEV.noSnap){
    if(!h.isJunk){ h.mood='flee'; h.moodT=180; h.interest=0; }
    hooked=null; S.snaps++; Sfx.snap(); shake=8;
    resultCard('LINE SNAPPED','EASE OFF WHEN IT RUNS.',null,0); return;
  }
  if (h.x<=SHORE_X){
    state='LAND'; landT=70; fisher.pose='hold';
    Sfx.land(); sparkle(fisher.x,fisher.y-42,14); flash=6; splash(SHORE_X+6,WATER_Y,8);
  }
}
function resultCard(title,sub,entry,value){
  state='RESULT'; resultT=0; fisher.pose='idle';
  result={title,sub,entry,value};
  if (value>0){ rupees+=value; S.rupeesLifetime+=value; Sfx.rupee(); }
  checkUnlocks(true);
  flushSave();
}
function landCatch(){
  const h=hooked; caught++;
  if (fightFrames>(S.longestFight||0)) S.longestFight=fightFrames;
  let sub, entry=null;
  if (h.isJunk){ sub=h.sub; S.junkCaught++; }
  else {
    sub = h.inches+' IN   '+h.pounds+' LB';
    entry=h; S.fishCaught++;
    S.species[h.name]=(S.species[h.name]||0)+1;
    S.lvFish[LEVEL_I]=(S.lvFish[LEVEL_I]||0)+1;
    if (h.name===LEVEL.goal.star) S.lvStar[LEVEL_I]=true;
    if (peakTension<82) S.cleanCatches++;
    if (h.inches>(S.biggestIn||0)) S.biggestIn=h.inches;
    if (h.val>(S.bestVal||0)){ S.bestVal=h.val; S.bestName=h.name; S.bestIn=h.inches; }
    if (h.name==='GOLDEN CARP' && !S.epic){ S.epic=true; say('NEW MUSIC: THE GOLDEN RUN',200); }
    const i=fishes.indexOf(h); if(i>=0) fishes.splice(i,1);
    if (fishes.length<6) fishes.push(makeFish(null,true));
    if (!S.cleared[LEVEL_I] && S.lvFish[LEVEL_I]>=LEVEL.goal.fish && S.lvStar[LEVEL_I]){
      S.cleared[LEVEL_I]=true; Sfx.clear();
      say(LEVEL.name+' CLEARED!',220);
    }
  }
  if (!junk && Math.random()<.5) junk=makeJunk();
  resultCard(h.isJunk?'REELED IN':'CAUGHT!', sub, entry, h.val);
  hooked=null;
}

const MENU={screen:'main',sel:0};
const menuStack=[];
function menuGo(s){ menuStack.push(MENU.screen); MENU.screen=s; MENU.sel=0; Sfx.ui(); }
function menuBack(){
  if (menuStack.length){ MENU.screen=menuStack.pop(); MENU.sel=0; Sfx.back(); }
  else { MODE='TITLE'; MT=0; Sfx.back(); }
}
function slotLabel(n){
  const d=Store.read(n);
  if (!d) return 'EMPTY';
  const cl=(d.cleared||[]).filter(Boolean).length;
  return (d.rupees||0)+'R '+(d.fishCaught||0)+'F '+cl+'/8';
}
function startGame(){
  if (!S.open[LEVEL_I]) { setLevel(0); }
  MODE='GAME'; MT=0; initWorld(); resetCast();
  Music.play(S.epic && S.track==='golden' ? 'golden' : 'still');
  flushSave();
}
function goalText(i){
  const L=LEVELS[i];
  if (S.cleared[i]) return 'CLEARED';
  return (S.lvFish[i]||0)+'/'+L.goal.fish+' + '+(S.lvStar[i]?'\u2605':L.goal.star.split(' ')[0]);
}
function menuRows(){
  const m=MENU.screen;
  if (m==='main') return [
    ['CAST OFF', LEVEL.name, ()=>startGame(), null, LEVEL.blurb],
    ['LURES', curLure().name, ()=>menuGo('lures'), null, curLure().desc],
    ['OUTFIT', OUTFITS[S.outfit].name, ()=>menuGo('outfit'), null, 'CHANGE THE TUNIC COLOUR.'],
    ['WATERS', (S.open.filter(Boolean).length)+'/8', ()=>menuGo('levels'), null, 'CLEAR A WATER TO OPEN THE NEXT.'],
    ['RECORDS','', ()=>menuGo('records'), null, 'EVERYTHING YOU HAVE LANDED.'],
    ['OPTIONS','', ()=>menuGo('options'), null, 'MUSIC, SOUND, SCANLINES.'],
    ['SAVE FILE','SLOT '+(slot+1), ()=>menuGo('save'), null, slotLabel(slot)]
  ];
  if (m==='lures') return LURES.map((L,i)=>{
    const owned=S.lures.indexOf(i)>=0;
    return [L.name, owned?(S.lure===i?'EQUIPPED':'OWNED'):(L.cost+'R'),
      ()=>{ if(owned){ S.lure=i; Sfx.ui(); flushSave(); }
            else if (rupees>=L.cost){ rupees-=L.cost; S.lures.push(i); S.lure=i; Sfx.unlock(); say('BOUGHT '+L.name); flushSave(); }
            else { Sfx.deny(); say('NOT ENOUGH RUPEES'); } },
      owned?null:'lock', L.desc];
  });
  if (m==='outfit') return OUTFITS.map((o,i)=>
    [o.name, S.outfit===i?'WEARING':'', ()=>{ S.outfit=i; Sfx.ui(); flushSave(); }, null, 'THE FISH DO NOT MIND EITHER WAY.']);
  if (m==='levels') return LEVELS.map((L,i)=>{
    const open=S.open[i];
    return [ (i+1)+'. '+L.name,
      open ? (S.cleared[i]?'\u2605 CLEAR':'DIFF '+L.diff) : 'LOCKED',
      ()=>{ if(open){ setLevel(i); Sfx.ui(); initWorld(); flushSave(); }
            else { Sfx.deny(); say(progressText(i)); } },
      open?null:'lock',
      open ? (L.blurb+'  '+goalText(i)) : (L.need+'  ('+progressText(i)+')') ];
  });
  if (m==='options') return [
    ['MUSIC', ['OFF','LOW','MED','HIGH'][Music.vol], ()=>{ Music.setVol((Music.vol+1)%4); flushSave(); Sfx.ui(); }, null, 'BACKGROUND VOLUME.'],
    ['TRACK', S.track==='golden'?'GOLDEN RUN':'STILL WATER',
      ()=>{ if(!S.epic){ Sfx.deny(); say('LAND A GOLDEN CARP FIRST'); return; }
            S.track = S.track==='golden'?'still':'golden';
            Music.play(S.track==='golden'?'golden':'still'); Sfx.ui(); flushSave(); },
      S.epic?null:'lock', S.epic?'TWO ORIGINALS. PICK YOUR MOOD.':'THE SECOND TRACK IS EARNED.'],
    ['SOUND FX', Sfx.muted?'OFF':'ON', ()=>{ Sfx.toggle(); Sfx.ui(); }, null, 'SPLASHES, REEL, HOOKSETS.'],
    ['CRT LINES', DEV.crt?'ON':'OFF', ()=>{ DEV.crt=!DEV.crt; S.crt=DEV.crt; Sfx.ui(); flushSave(); }, null, 'SCANLINE OVERLAY.']
  ];
  if (m==='save') return [
    ['SLOT 1', slotLabel(0)+(slot===0?' \u25c0':''), ()=>{ flushSave(); loadSlot(0); Sfx.ui(); say('SLOT 1 LOADED'); }, null, 'LOAD THIS FILE.'],
    ['SLOT 2', slotLabel(1)+(slot===1?' \u25c0':''), ()=>{ flushSave(); loadSlot(1); Sfx.ui(); say('SLOT 2 LOADED'); }, null, 'LOAD THIS FILE.'],
    ['SLOT 3', slotLabel(2)+(slot===2?' \u25c0':''), ()=>{ flushSave(); loadSlot(2); Sfx.ui(); say('SLOT 3 LOADED'); }, null, 'LOAD THIS FILE.'],
    ['SAVE NOW','', ()=>{ flushSave(); Sfx.rupee(); say(Store.persistent?'SAVED TO SLOT '+(slot+1):'SAVED (SESSION ONLY)'); },
      null, Store.persistent?'WRITES TO THIS DEVICE.':'STORAGE BLOCKED HERE.'],
    ['ERASE SLOT','', ()=>{ Store.erase(slot); S=normalise(blankSave()); rupees=0; caught=0;
      setLevel(0); Sfx.snap(); say('SLOT '+(slot+1)+' ERASED'); }, null, 'CANNOT BE UNDONE.']
  ];
  return [];
}
function menuActivate(){ const r=menuRows()[MENU.sel]; if(r) r[2](); }
function menuPointer(p){
  const rows=menuRows();
  if (p.y<32 && p.x<44){ menuBack(); return; }
  for (let i=0;i<rows.length;i++){
    const y=44+i*17;
    if (p.y>=y-3 && p.y<y+14 && p.x>26 && p.x<W-26){ MENU.sel=i; menuActivate(); return; }
  }
  if (p.y>H-22) menuBack();
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(){
  T++; MT++; S.playFrames++;
  if (++saveTimer>1800) flushSave();
  if (IN.down) IN.held++;
  fisher.bob=Math.sin(T*.05)*.5;
  for (const c of clouds){ c.x+=c.s; if(c.x>W+30) c.x=-46; }
  for (const b of birds){ b.x+=b.s; b.ph+=.12; if(b.x>W+14){ b.x=-14; b.y=rnd(14,40); } }

  if (DEV.open){ IN.justDown=IN.justUp=IN.tapped=IN.act=IN.back=false; IN.nav=0; updateFx(); return; }

  if (MODE==='SPLASH'){
    if (MT===12) Sfx.logo();
    if (MT>250 || IN.justDown){ MODE='INTRO'; MT=0; }
  }
  else if (MODE==='INTRO'){
    if (MT===4) Music.play('still');
    if (MT===372) Sfx.bird();
    if (MT>558 || IN.justDown){ MODE='TITLE'; MT=0; Music.play(S.epic&&S.track==='golden'?'golden':'still'); }
  }
  else if (MODE==='TITLE'){
    if (MT>20 && IN.justDown){ MODE='MENU'; MT=0; MENU.screen='main'; MENU.sel=0; menuStack.length=0; Sfx.ui(); }
  }
  else if (MODE==='MENU'){
    const rows=menuRows();
    if (IN.nav===-1){ MENU.sel=(MENU.sel-1+rows.length)%rows.length; Sfx.ui(); }
    if (IN.nav=== 1){ MENU.sel=(MENU.sel+1)%rows.length; Sfx.ui(); }
    if (IN.nav===-2||IN.nav===2){ if(rows[MENU.sel]) rows[MENU.sel][2](); }
    if (IN.act) menuActivate();
    if (IN.back) menuBack();
  }
  else if (MODE==='GAME'){
    const reeling = state==='FIGHT' ? IN.down : (IN.down && IN.held>8);
    const tap = IN.justUp && IN.tapped;
    if (IN.back && (state==='READY'||state==='RESULT')){
      MODE='MENU'; MT=0; MENU.screen='main'; MENU.sel=0; menuStack.length=0; flushSave(); Sfx.back();
    }
    switch(state){
      case 'READY': {
        const rt=rodTip(); lure.x=rt.x+1; lure.y=rt.y+9+Math.sin(T*.07)*1.5;
        if (IN.justDown){ state='CHARGE'; power=0; powerDir=1; fisher.pose='charge'; setHint('RELEASE TO CAST',90); }
        break;
      }
      case 'CHARGE': {
        power+=2.2*powerDir;
        if (power>=100){ power=100; powerDir=-1; Sfx.tick(); }
        if (power<=0){ power=0; powerDir=1; Sfx.tick(); }
        const rt=rodTip(); lure.x=rt.x; lure.y=rt.y+6;
        if (IN.justUp){
          const p=power/100;
          lure.vx=1.5+p*3.3; lure.vy=-(2.0+p*2.6);
          lure.wet=false; castStartX=lure.x;
          state='FLY'; fisher.pose='cast'; S.casts++; Sfx.cast(); setHint('',0);
        }
        break;
      }
      case 'FLY':
        lure.vy+=.13; lure.vx*=.99; lure.x+=lure.vx; lure.y+=lure.vy;
        if (lure.x>W-6){ lure.x=W-6; lure.vx*=-.4; }
        if (lure.y>=WATER_Y){
          lure.y=WATER_Y; lure.wet=true; state='WATER';
          lure.vx*=.35; lure.vy=.5;
          const dist=Math.round(lure.x-castStartX);
          if (dist>(S.longestCast||0)) S.longestCast=dist;
          Sfx.splash(); crown(lure.x,WATER_Y); splash(lure.x,WATER_Y,5); shake=1.2;
          attractPulse(1.4);
          setHint('TAP TWITCH \u2022 HOLD REEL \u2022 WAIT TO SINK',180);
        }
        break;
      case 'WATER': {
        const sink=curLure().sink;
        lure.vy=clamp(lure.vy+.014*sink*2.6,-3,sink);
        lure.vx*=.93;
        if (reeling){
          lure.vx-=.12; lure.vy-=.10; lure.jig=Math.max(lure.jig,1.1);
          if (T%7===0) Sfx.reel();
          if (T%5===0) attractPulse(.35);
          if (T%9===0) ripples.push({x:lure.x,y:lure.y,r:1,life:14});
        }
        lure.vx=clamp(lure.vx,-2.2,2.2);
        lure.x+=lure.vx; lure.y+=lure.vy+lure.pull*.06;
        lure.y=clamp(lure.y,WATER_Y,BOT-2);
        lure.jig*=.88;
        if (nibbleT>0 && (IN.justDown||reeling)){ setHook(); break; }
        if (tap){
          lure.vy-=1.7; lure.vx-=.5; lure.jig=2.6;
          S.twitches++; Sfx.twitch(); attractPulse(1.0);
          ripples.push({x:lure.x,y:lure.y,r:1,life:18});
        }
        if (junk && !hooked && lure.y>BOT-22){
          const d=Math.hypot(lure.x-(junk.x+junk.w/2),lure.y-(junk.y+junk.h/2));
          if (d<10) hookJunk();
        }
        if (lure.x<=SHORE_X-2){ Sfx.splash(); resetCast(); }
        break;
      }
      case 'FIGHT': if (hooked) updateFight(reeling); break;
      case 'LAND':
        if (hooked){
          hooked.x+=(fisher.x+2-hooked.x)*.18;
          hooked.y+=((fisher.y-42)-hooked.y)*.18;
          if (!hooked.isJunk) hooked.tailBoost=.18;
        }
        if (T%10===0) sparkle(fisher.x,fisher.y-42,2);
        if (--landT<=0) landCatch();
        break;
      case 'RESULT':
        resultT++;
        if (resultT>24 && IN.justDown){ result=null; resetCast(); }
        break;
    }
    updateFish();
  }
  updateFx();
  IN.justDown=IN.justUp=IN.tapped=IN.act=IN.back=false; IN.nav=0;
}

function bevel(x,y,w,h,tint){
  x=R(x);y=R(y);w=R(w);h=R(h);
  g.fillStyle=tint||'rgba(14,22,40,.94)'; g.fillRect(x,y,w,h);
  g.fillStyle=P.ui[4]; g.fillRect(x,y,w,1); g.fillRect(x,y+h-1,w,1); g.fillRect(x,y,1,h); g.fillRect(x+w-1,y,1,h);
  g.fillStyle=P.ui[0]; g.fillRect(x+1,y+1,w-2,1); g.fillRect(x+1,y+1,1,h-2);
  g.fillStyle=P.ui[2]; g.fillRect(x+1,y+h-2,w-2,1); g.fillRect(x+w-2,y+1,1,h-2);
  g.fillStyle='rgba(255,255,255,.05)'; g.fillRect(x+2,y+2,w-4,R(h*.4));
  g.fillStyle=P.ui[0];
  g.fillRect(x+2,y+2,2,1); g.fillRect(x+2,y+2,1,2);
  g.fillRect(x+w-4,y+2,2,1); g.fillRect(x+w-3,y+2,1,2);
  g.fillRect(x+2,y+h-3,2,1); g.fillRect(x+2,y+h-4,1,2);
  g.fillRect(x+w-4,y+h-3,2,1); g.fillRect(x+w-3,y+h-4,1,2);
}

function drawLobster(x,y,s,t){
  const px=(a,b,w,h,c)=>{ g.fillStyle=c; g.fillRect(R(x+a*s),R(y+b*s),R(w*s),R(h*s)); };
  const sh='#7a1408', bs='#d02818', hi='#ff6a4c', ink='#2a0804';
  const w1=Math.sin(t*.09)*1.1, w2=Math.sin(t*.09+1)*1.1;
  px(-1+w1*.5,-9,1,5,sh); px(6-w1*.5,-9,1,5,sh);
  px(-9+w1,-4,6,5,bs); px(-9+w1,-4,6,2,hi); px(-10+w1,-4,3,2,sh); px(-10+w1,-1,3,2,sh);
  px(8-w2,-4,6,5,bs); px(8-w2,-4,6,2,hi); px(12-w2,-4,3,2,sh); px(12-w2,-1,3,2,sh);
  px(-4,-2,4,2,sh); px(5,-2,4,2,sh);
  px(-4,-6,9,5,bs); px(-4,-6,9,2,hi);
  px(-3,-1,7,4,bs); px(-3,-1,7,1,hi);
  px(-3,3,7,4,bs); px(-3,3,7,1,'#e8503c');
  px(-2,7,5,3,sh);
  px(-4,10,3,3,bs); px(2,10,3,3,bs); px(-1,10,3,4,sh);
  for(let i=0;i<3;i++){ px(-6,i*2.5,3,1,sh); px(4,i*2.5,3,1,sh); }
  px(-2,-5,2,2,'#ffffff'); px(3,-5,2,2,'#ffffff');
  px(-1.5,-4.5,1,1,ink); px(3.5,-4.5,1,1,ink);
}
function drawSplash(){
  const t=MT;

}

function jaggedRidge(cam,rate,baseY,amp,col,snow,seed){
  const step=13, off=cam*rate, i0=Math.floor((off-30)/step);
  g.fillStyle=col; g.beginPath(); g.moveTo(-24,baseY);
  const pk=[];
  for(let i=i0;i<i0+(W+70)/step;i++){
    const x=i*step-off;
    const h=baseY-amp*(.30+.70*hash(i*1.7+seed));
    const vx=x+step*.5, vh=baseY-amp*(.10+.28*hash(i*3.1+seed+40));
    g.lineTo(x,h); g.lineTo(vx,vh);
    pk.push([x,h]);
  }
  g.lineTo(W+24,baseY); g.closePath(); g.fill();
  if (snow) for (const p of pk){
    if (p[1] < baseY-amp*.62){
      g.fillStyle='#f4fbff';
      g.beginPath(); g.moveTo(p[0],p[1]); g.lineTo(p[0]-5,p[1]+7); g.lineTo(p[0]+5,p[1]+7); g.closePath(); g.fill();
      g.fillStyle='#cfe4f0'; g.fillRect(R(p[0])+1,R(p[1])+4,4,3);
    }
  }
}
function conifer(x,base,h,w,c){
  g.fillStyle=c[3]; g.fillRect(R(x)-1,R(base)-3,3,4);
  for(let k=2;k>=0;k--){
    const kh=h*(.42+k*.16), ky=base-h*(.18+k*.30), kw=w*(.55+k*.30);
    g.fillStyle=c[k===2?2:1];
    g.beginPath(); g.moveTo(x,ky-kh); g.lineTo(x-kw,ky); g.lineTo(x+kw,ky); g.closePath(); g.fill();
    g.fillStyle=c[0];
    g.beginPath(); g.moveTo(x,ky-kh); g.lineTo(x-kw*.45,ky); g.lineTo(x,ky); g.closePath(); g.fill();
  }
}

function heron(x,base,t,fly){
  const c1='#8fa4b4', c2='#5f7484', c3='#3a4a58', bk='#e8c040';
  if (!fly){
    g.fillStyle=c3; g.fillRect(R(x),R(base)-16,2,16); g.fillRect(R(x)+5,R(base)-14,2,14);
    g.fillStyle=c2; g.beginPath(); g.ellipse(R(x)+3,R(base)-22,11,7,0,0,6.284); g.fill();
    g.fillStyle=c1; g.beginPath(); g.ellipse(R(x)+1,R(base)-24,8,4,0,0,6.284); g.fill();
    g.fillStyle=c3; g.beginPath(); g.moveTo(x-8,base-22); g.lineTo(x-16,base-18); g.lineTo(x-7,base-19); g.closePath(); g.fill();
    const nb=Math.sin(t*.05)*2;
    g.fillStyle=c2; g.fillRect(R(x)+8,R(base)-34+nb,2,12);
    g.fillStyle=c1; g.beginPath(); g.ellipse(R(x)+10,R(base)-36+nb,4,3,0,0,6.284); g.fill();
    g.fillStyle=bk; g.fillRect(R(x)+13,R(base)-36+nb,7,2);
    g.fillStyle='#0a0e16'; g.fillRect(R(x)+10,R(base)-37+nb,1,1);
  } else {
    const lift=Math.min(60,(t)*1.1), flap=Math.sin(t*.28);
    const yy=base-22-lift, xx=x+lift*.7;
    g.fillStyle=c2; g.beginPath(); g.ellipse(R(xx),R(yy),11,5,0,0,6.284); g.fill();
    g.fillStyle=c1;
    g.beginPath(); g.moveTo(xx,yy); g.lineTo(xx-16,yy-14*flap-4); g.lineTo(xx-2,yy-2); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(xx,yy); g.lineTo(xx+14,yy-13*flap-4); g.lineTo(xx+2,yy-2); g.closePath(); g.fill();
    g.fillStyle=c2; g.fillRect(R(xx)+9,R(yy)-5,3,3);
    g.fillStyle=bk; g.fillRect(R(xx)+12,R(yy)-5,7,2);
    g.fillStyle=c3; g.fillRect(R(xx)-14,R(yy)+2,12,2);
  }
}

const DEV={open:false,tab:0,sel:0,scroll:0,ai:true,noSnap:false,crt:true,
           hitbox:false,labels:false,curMul:1,fightMul:1};
const DEV_TABS=['WARP','TOGGLE','STATS'], DEV_VIS=11;
function devOpen(){ DEV.open=true; DEV.sel=0; DEV.scroll=0; release(); Sfx.open(); }

function warpTo(kind,arg){
  result=null; hooked=null; nibbleT=0; nibbleFish=null;
  fight.tension=0; fight.slackT=0; fisher.pose='idle';
  const put=(px,py)=>{ lure.x=px; lure.y=py; lure.vx=0; lure.vy=0; lure.wet=py>=WATER_Y; };
  const go=()=>{ MODE='GAME'; };
  const fresh=(name)=>{
    go(); const f=makeFish(name,false);
    f.x=230; f.y=WATER_Y+DEPTH*.5; f.mood='hooked'; f.dir=-1;
    fishes.push(f); hooked=f;
    fight.mode='run'; fight.modeT=50; fight.stam=f.t.stam; fight.maxStam=f.t.stam;
    fight.startX=f.x; fight.tension=30; fightFrames=0; peakTension=30;
    state='FIGHT'; fisher.pose='fight'; put(f.x+9*f.len,f.y-1);
  };
  switch(kind){
    case 'splash': MODE='SPLASH'; MT=0; break;
    case 'intro':  MODE='INTRO'; MT=0; break;
    case 'intro2': MODE='INTRO'; MT=186; break;
    case 'intro3': MODE='INTRO'; MT=372; break;
    case 'title':  MODE='TITLE'; MT=0; break;
    case 'menu':   MODE='MENU'; MT=0; MENU.screen=arg||'main'; MENU.sel=0; menuStack.length=0; break;
    case 'ready':  go(); resetCast(); break;
    case 'charge': go(); resetCast(); state='CHARGE'; power=arg; fisher.pose='charge'; break;
    case 'fly':    go(); resetCast(); state='FLY'; lure.vx=4; lure.vy=-4; break;
    case 'water':  go(); resetCast(); state='WATER'; put(arg.x,arg.y); break;
    case 'bite': { go(); resetCast(); state='WATER'; put(220,WATER_Y+DEPTH*.45);
      const f=makeFish(arg,false); f.x=226; f.y=lure.y; f.dir=-1; fishes.push(f); startNibble(f); break; }
    case 'fight':      fresh(arg); break;
    case 'fightHot':   fresh('POND BASS'); fight.tension=95; break;
    case 'fightSlack': fresh('MUD CATFISH'); fight.tension=2; fight.slackT=140; break;
    case 'fightSpent': fresh('HYLIAN LOACH'); fight.stam=0; fight.mode='rest'; fight.modeT=600; break;
    case 'fightShore': fresh('POND BASS'); fight.startX=SHORE_X+40; hooked.x=SHORE_X+6; break;
    case 'junk': { junk=makeJunk(arg); junk.x=200; go(); resetCast(); state='WATER';
      put(junk.x+junk.w/2,junk.y); hookJunk(); break; }
    case 'land': fresh('GOLDEN CARP'); state='LAND'; landT=70; fisher.pose='hold'; break;
    case 'resFish': { go(); const f=makeFish(arg||'HYLIAN LOACH',false);
      resultCard('CAUGHT!',f.inches+' IN   '+f.pounds+' LB',f,0); break; }
    case 'resJunk': go(); resultCard('REELED IN',JUNK[2].sub,null,0); break;
    case 'resSnap': go(); resultCard('LINE SNAPPED','EASE OFF WHEN IT RUNS.',null,0); break;
    case 'resSlip': go(); resultCard('LINE WENT SLACK','THE HOOK SLIPPED FREE.',null,0); break;
    case 'pondEmpty': fishes=[]; junk=null; go(); resetCast(); break;
    case 'pondFull': fishes=[]; for(let i=0;i<12;i++) fishes.push(makeFish(null,false)); go(); resetCast(); break;
    case 'pondOne': fishes=[]; for(let i=0;i<6;i++) fishes.push(makeFish(arg,false)); go(); resetCast(); break;
    case 'level': S.open[arg]=true; setLevel(arg); initWorld(); go(); resetCast(); break;
    case 'respawn': initWorld(); go(); resetCast(); break;
    case 'give': rupees+=arg; S.rupeesLifetime+=arg; checkUnlocks(true); flushSave(); Sfx.rupee(); break;
    case 'allLures': S.lures=[0,1,2,3]; flushSave(); Sfx.unlock(); break;
    case 'clearOne': S.cleared[LEVEL_I]=true; S.lvStar[LEVEL_I]=true;
      S.lvFish[LEVEL_I]=LEVEL.goal.fish; checkUnlocks(true); flushSave(); Sfx.clear(); break;
    case 'unlockAll': for(let i=0;i<8;i++) S.open[i]=true; S.epic=true; flushSave(); Sfx.unlock(); break;
    case 'music': S.track=arg; Music.play(arg); break;
    case 'wipe': Store.erase(slot); S=normalise(blankSave()); rupees=0; caught=0; setLevel(0); Sfx.snap(); break;
    case 'save': flushSave(); Sfx.rupee(); break;
  }
  if (['give','save','wipe','allLures','unlockAll','music','clearOne'].indexOf(kind)<0) DEV.open=false;
}

  if (DEV.tab===0) return [
    ['SPLASH - LOBSTER LABZ',()=>warpTo('splash')],
    ['INTRO 1 - HEADWATERS', ()=>warpTo('intro')],
    ['INTRO 2 - CEDAR RUN',  ()=>warpTo('intro2')],
    ['INTRO 3 - HERON MARSH',()=>warpTo('intro3')],
    ['TITLE SCREEN',         ()=>warpTo('title')],
    ['MENU - MAIN',    ()=>warpTo('menu','main')],
    ['MENU - LURES',   ()=>warpTo('menu','lures')],
    ['MENU - OUTFIT',  ()=>warpTo('menu','outfit')],
    ['MENU - WATERS',  ()=>warpTo('menu','levels')],
    ['MENU - RECORDS', ()=>warpTo('menu','records')],
    ['MENU - OPTIONS', ()=>warpTo('menu','options')],
    ['MENU - SAVE',    ()=>warpTo('menu','save')],
    ['READY TO CAST',  ()=>warpTo('ready')],
    ['CHARGE - 100%',  ()=>warpTo('charge',100)],

    ['LURE - BOTTOM',  ()=>warpTo('water',{x:250,y:BOT-6})],
    ['BITE - BLUEGILL',()=>warpTo('bite','BLUEGILL')],
    ['BITE - BASS',    ()=>warpTo('bite','POND BASS')],
    ['BITE - CATFISH', ()=>warpTo('bite','MUD CATFISH')],
    ['BITE - LOACH',   ()=>warpTo('bite','HYLIAN LOACH')],
    ['BITE - CARP',    ()=>warpTo('bite','GOLDEN CARP')],
    ['FIGHT - BLUEGILL',()=>warpTo('fight','BLUEGILL')],
    ['FIGHT - BASS',   ()=>warpTo('fight','POND BASS')],
    ['FIGHT - CATFISH',()=>warpTo('fight','MUD CATFISH')],
    ['FIGHT - LOACH',  ()=>warpTo('fight','HYLIAN LOACH')],
    ['FIGHT - CARP',   ()=>warpTo('fight','GOLDEN CARP')],
    ['FIGHT - TENSION 95',()=>warpTo('fightHot')],
    ['FIGHT - SLACK EDGE',()=>warpTo('fightSlack')],
    ['FIGHT - SPENT FISH',()=>warpTo('fightSpent')],
    ['FIGHT - AT SHORE',  ()=>warpTo('fightShore')],
    ['JUNK - OLD BOOT',   ()=>warpTo('junk','OLD BOOT')],
    ['JUNK - BOTTLE',     ()=>warpTo('junk','SUNKEN BOTTLE')],
    ['JUNK - SILVER RUPEE',()=>warpTo('junk','SILVER RUPEE')],
    ['LAND SEQUENCE',     ()=>warpTo('land')],
    ['RESULT - FISH',     ()=>warpTo('resFish','HYLIAN LOACH')],
    ['RESULT - CARP',     ()=>warpTo('resFish','GOLDEN CARP')],
    ['RESULT - JUNK',     ()=>warpTo('resJunk')],
    ['RESULT - SNAPPED',  ()=>warpTo('resSnap')],
    ['RESULT - SLIPPED',  ()=>warpTo('resSlip')],
    ['POND - EMPTY',      ()=>warpTo('pondEmpty')],
    ['POND - CROWDED',    ()=>warpTo('pondFull')],
    ['POND - ALL CARP',   ()=>warpTo('pondOne','GOLDEN CARP')],
    ['POND - RESPAWN',    ()=>warpTo('respawn')]
  ].concat(LEVELS.map((L,i)=>['WATER '+(i+1)+' - '+L.name, ()=>warpTo('level',i)]));
  if (DEV.tab===1) return [
    ['SOUND FX',      ()=>Sfx.toggle(), ()=>!Sfx.muted],
    ['MUSIC: STILL',  ()=>warpTo('music','still'),  ()=>Music.track==='still'],
    ['MUSIC: GOLDEN', ()=>warpTo('music','golden'), ()=>Music.track==='golden'],
    ['MUSIC OFF',     ()=>Music.stop(), ()=>!Music.track],
    ['CRT SCANLINES', ()=>{DEV.crt=!DEV.crt;S.crt=DEV.crt;}, ()=>DEV.crt],
    ['FISH AI',       ()=>DEV.ai=!DEV.ai, ()=>DEV.ai],
    ['LINE CAN SNAP', ()=>DEV.noSnap=!DEV.noSnap, ()=>!DEV.noSnap],
    ['BITE MAGNET X6',()=>DEV.curMul=DEV.curMul===1?6:1, ()=>DEV.curMul>1],
    ['FAST FIGHT X5', ()=>DEV.fightMul=DEV.fightMul===1?5:1, ()=>DEV.fightMul>1],
    ['AI LABELS',     ()=>DEV.labels=!DEV.labels, ()=>DEV.labels],
    ['HITBOXES',      ()=>DEV.hitbox=!DEV.hitbox, ()=>DEV.hitbox],
    ['CLEAR THIS WATER',()=>warpTo('clearOne')],
    ['UNLOCK ALL WATERS',()=>warpTo('unlockAll')],
    ['GIVE ALL LURES',()=>warpTo('allLures')],
    ['GIVE 1000R',    ()=>warpTo('give',1000)],
    ['FORCE SAVE',    ()=>warpTo('save')],
    ['WIPE THIS SLOT',()=>warpTo('wipe')]
  ];
  return [];
}
function devKey(e){
  e.preventDefault();
  const rows=devRows(), n=Math.max(1,rows.length);
  if (e.code==='Escape') return devClose();
  if (e.code==='ArrowLeft'){ DEV.tab=(DEV.tab+2)%3; DEV.sel=0; DEV.scroll=0; Sfx.ui(); return; }
  if (e.code==='ArrowRight'){ DEV.tab=(DEV.tab+1)%3; DEV.sel=0; DEV.scroll=0; Sfx.ui(); return; }
  if (e.code==='ArrowUp'){ DEV.sel=(DEV.sel-1+n)%n; Sfx.ui(); }
  if (e.code==='ArrowDown'){ DEV.sel=(DEV.sel+1)%n; Sfx.ui(); }
  if (e.code==='Enter'||e.code==='Space'){ if(rows[DEV.sel]){ rows[DEV.sel][1](); Sfx.ui(); } }
  if (DEV.sel<DEV.scroll) DEV.scroll=DEV.sel;
  if (DEV.sel>=DEV.scroll+DEV_VIS) DEV.scroll=DEV.sel-DEV_VIS+1;
}
function devPointer(p){
  if (p.x>W-26&&p.y<20) return devClose();
  if (p.y>=22&&p.y<34){ const i=Math.floor((p.x-14)/64);
    if (i>=0&&i<3){ DEV.tab=i; DEV.sel=0; DEV.scroll=0; Sfx.ui(); return; } }
  const rows=devRows();
  if (p.y>=38&&p.y<38+DEV_VIS*15){
    const i=DEV.scroll+Math.floor((p.y-38)/15);
    if (rows[i]){ DEV.sel=i; rows[i][1](); Sfx.ui(); } return;
  }
  if (p.y>H-22){
    if (p.x<W/2) DEV.scroll=Math.max(0,DEV.scroll-DEV_VIS);
    else DEV.scroll=Math.min(Math.max(0,rows.length-DEV_VIS),DEV.scroll+DEV_VIS);
    DEV.sel=DEV.scroll; Sfx.ui();
  }
}
function drawDev(){
  g.fillStyle='rgba(4,8,16,.92)'; g.fillRect(0,0,W,H);
  bevel(6,4,W-12,H-8,'rgba(10,16,30,.96)');
  txt("ANGLER'S POND - DEV",14,10,P.green);
  txt('V4.0',W-62,10,P.ui[2]); txt('[X]',W-26,10,P.red);
  DEV_TABS.forEach((tb,i)=>{
    const x=14+i*64, on=DEV.tab===i;
    g.fillStyle=on?P.ui[3]:'rgba(30,40,60,.6)'; g.fillRect(x,22,60,12);
    g.fillStyle=on?P.green:P.ui[2]; g.fillRect(x,22,60,1);
    txt(tb,x+30,25,on?'#fff':P.ui[2],'center');
  });
  if (DEV.tab===2){
    const L=[['MODE',MODE],['STATE',state],['WATER',LEVEL_I+1],['LURE',S.lure],
      ['CASTS',S.casts],['BITES',S.bites],['HOOKSETS',S.hooksets],['CLEANSET',S.cleanSets],
      ['FISH',S.fishCaught],['JUNK',S.junkCaught],['SNAPS',S.snaps],['SLIPS',S.slips],
      ['RUPEES',rupees],['LIFETIME',S.rupeesLifetime],
      ['OPEN',S.open.filter(Boolean).length+'/8'],['CLEARED',S.cleared.filter(Boolean).length+'/8']];
    L.forEach((r,i)=>{ const cx=14+(i%2)*148, cy=42+Math.floor(i/2)*12;
      txt(r[0],cx,cy,P.ui[1]); txt(String(r[1]),cx+134,cy,'#eef4fc','right'); });
    let y=146; txt('POND',14,y,P.gold[1]); y+=11;
    fishes.slice(0,6).forEach((f,i)=>{
      txt(f.name.slice(0,10),18,y+i*10,P.ui[0]);
      txt('D'+((f.y-WATER_Y)/DEPTH).toFixed(2)+' I'+Math.round(f.interest)+' '+f.mood.slice(0,4),
          W-20,y+i*10,f.mood==='wander'?P.ui[2]:P.green,'right');
    });
    txt(Store.persistent?('SAVE OK - SLOT '+(slot+1)):'SAVE: MEMORY ONLY',
        14,H-18,Store.persistent?P.green:P.amber);
    return;
  }
  const rows=devRows();
  for(let i=0;i<DEV_VIS;i++){
    const idx=DEV.scroll+i; if (idx>=rows.length) break;
    const row=rows[idx], y=38+i*15, on=idx===DEV.sel;
    if (on){ g.fillStyle='rgba(70,120,180,.35)'; g.fillRect(10,y-2,W-20,14);
             g.fillStyle=P.green; g.fillRect(10,y-2,2,14); }
    txt(String(idx+1).padStart(2,'0'),16,y+2,P.ui[2]);
    txt(row[0],34,y+2,on?'#ffffff':P.ui[0]);
    if (row[2]){
      const v=row[2]();
      g.fillStyle=v?P.green:P.ui[3]; g.fillRect(W-48,y,30,11);
      g.fillStyle=v?'#dfffd8':P.ui[2]; g.fillRect(v?W-29:W-48,y,11,11);
      txt(v?'ON':'OFF',W-33,y+2,v?'#0c2a0c':P.ui[1],'center');
    }
  }
  if (rows.length>DEV_VIS){ txt('\u25c0 PAGE',14,H-18,P.ui[2]); txt('PAGE \u25b6',W-14,H-18,P.ui[2],'right'); }
  txt('ARROWS  ENTER  ` CLOSE',160,H-18,P.ui[2],'center');
}
function drawDebug(){
  if (DEV.labels) for (const f of fishes)
    txt(f.mood.slice(0,4)+' '+Math.round(f.interest),f.x,f.y-16,'#9fffa0','center');
  if (DEV.hitbox){
    g.lineWidth=1; g.strokeStyle='#ff40a0';
    for (const f of fishes) g.strokeRect(R(f.x-11*f.len),R(f.y-6*f.len),R(22*f.len),R(12*f.len));
    g.strokeStyle='#40ffd0'; g.strokeRect(R(lure.x)-4,R(lure.y)-4,8,8); g.strokeRect(R(lure.x)-8,R(lure.y)-8,16,16);
    if (junk){ g.strokeStyle='#ffd040'; g.strokeRect(R(junk.x),R(junk.y),junk.w,junk.h); }
    g.strokeStyle='#ff8040'; g.beginPath(); g.moveTo(SHORE_X,WATER_Y); g.lineTo(SHORE_X,BOT); g.stroke();
  }
  if (DEV.labels||DEV.hitbox)
    txt(MODE+'/'+state+' T'+Math.round(fight.tension)+' D'+lureDepth().toFixed(2),4,H-12,'#9fffa0');
}

/* ============================================================
   FRAME
   ============================================================ */
function renderWorld(){
  renderSky();
  g.save();
  if (shake>0) g.translate(R(rnd(-shake,shake)),R(rnd(-shake,shake)));
  g.drawImage(sky,0,0);
  drawWater(); drawReflection(); drawWeeds(0); drawFloor();
  if (junk) drawJunkItem(junk,false);
  drawWeeds(1); drawFx();
  for (const f of fishes) if (f.mood!=='hooked') drawFish(f,false);
  if (hooked && !hooked.isJunk) drawFish(hooked,state==='LAND');
  if (hooked && hooked.isJunk)  drawJunkItem(hooked,state==='LAND');
  drawLine(); drawLure(); drawWeeds(2); drawSurface();
  drawBank(); drawFisher(); drawForeground();
  if (flash>0){ g.fillStyle='rgba(255,255,255,'+(flash/14)+')'; g.fillRect(-8,-8,W+16,H+16); }
  g.restore();
}
function render(){
  if (MODE==='SPLASH') drawSplash();
  else if (MODE==='INTRO') drawIntro();
  else {
    renderWorld();
    if (MODE==='GAME'){
      drawDebug(); drawDepthGauge(); drawHUD(); drawTensionMeter();
      if (state==='RESULT') drawResult();
    }
    if (MODE==='TITLE') drawTitleCard();
    if (MODE==='MENU') drawMenu();
    drawToast();
  }
  if (DEV.crt){ g.fillStyle='rgba(0,0,0,.13)'; for(let y=0;y<H;y+=2) g.fillRect(0,y,W,1); }
  const vg=g.createRadialGradient(W/2,H/2,88,W/2,H/2,205);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.38)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
  if (DEV.open) drawDev();
}
let acc=0, last=performance.now();
const STEP=1000/60;
function frame(now){
  acc+=Math.min(now-last,250); last=now;
  let guard=0;
  while (acc>=STEP && guard++<5){ update(); acc-=STEP; }
  if (state==='FIGHT' && IN.down) fisher.crank+=.35;
  render();
  requestAnimationFrame(frame);
}
window.addEventListener('pagehide',flushSave);
window.addEventListener('beforeunload',flushSave);

buildFont();
DEV.crt = S.crt!==false;
Music.setVol(S.music===undefined?2:S.music);
setLevel(S.open[S.level||0] ? (S.level||0) : 0);
checkUnlocks(false);
initWorld(); resetCast();
MODE='SPLASH'; MT=0;
requestAnimationFrame(frame);
})();
